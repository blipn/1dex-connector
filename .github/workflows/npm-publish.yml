name: npm publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish JavaScript connector then CLI
    if: >-
      github.repository == 'blipn/1dex-connector' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require current main and its successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${RELEASE_SHA}"
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&status=success&per_page=1" --jq '.total_count')"
          test "${COUNT}" -gt 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up npm trusted publishing support
        run: |
          npm install -g npm@11.13.0
          npm --version
          npm ci --ignore-scripts

      - name: Publish exact archives in dependency order with OIDC
        run: |
          set -euo pipefail
          for DIRECTORY in packages/js cli; do
            (
              cd "$DIRECTORY"
              npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
              EXISTS="$(node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, 'utf8'));
          if (packed.length !== 1 || packed[0].name !== name || packed[0].version !== version) throw new Error('Packed identity mismatch.');
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(15000),
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}; publication stopped.`);
          }
          const exists = response.status === 200;
          if (exists) {
            const published = await response.json();
            if (published.name !== name || published.version !== version) throw new Error('Registry identity mismatch.');
            if (!packed[0].integrity || published.dist?.integrity !== packed[0].integrity) {
              throw new Error(`${name}@${version}: registry archive differs from the tested local package; bump the version before publishing.`);
            }
          }
          console.log(exists);
          JS
              )"
              if [ "$EXISTS" = true ]; then
                echo "$DIRECTORY: exact version already published; skipped."
                exit 0
              fi
              ARCHIVE="$(node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const packed = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, 'utf8'));
          console.log(`${process.env.RUNNER_TEMP}/${packed[0].filename}`);
          JS
              )"
              npm publish "$ARCHIVE" --dry-run --access public
              npm publish "$ARCHIVE" --access public --provenance
            )
          done
