name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            python: "3.10"
          - node: 24
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run CI checks
        run: npm run ci

      - name: Pack JS package
        run: npm --cache /tmp/onedex-npm-cache pack --dry-run
        working-directory: packages/js

      - name: Pack CLI package
        run: npm --cache /tmp/onedex-npm-cache pack --dry-run
        working-directory: cli
